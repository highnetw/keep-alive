name: Supabase Keep Alive - Jokbo & Gyesang

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Jokbo DB
        run: |
          RESPONSE=$(curl -s \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/jokbo_persons?select=count&limit=1")
          echo "Response: $RESPONSE"
          echo "✅ Jokbo DB Ping 완료"

      - name: Ping Gyesang DB
        run: |
          RESPONSE=$(curl -s \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/members?select=count&limit=1")
          echo "Response: $RESPONSE"
          echo "✅ Gyesang DB Ping 완료"
